name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install -r requirements.txt

      - name: Build
        run: python -m PyInstaller --noconfirm CafeModManager.spec

      - uses: actions/upload-artifact@v4
        with:
          name: CafeModManager
          path: dist/CafeModManager.exe
